services:
  - type: web
    name: marketsent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci && npm run warm-model && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT 'src.api.app:create_app()'
    healthCheckPath: /api/health
    envVars:
      - key: DB_CONNECTION_STRING
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: MarketSent/1.0
      - key: REDDIT_SUBREDDITS
        value: stocks,wallstreetbets,investing,StockMarket
      - key: REDDIT_POST_LIMIT
        value: "250"
      - key: SENTIMENT_MODEL
        value: mikeysharma/finance-sentiment-analysis
      - key: SENTIMENT_DTYPE
        value: fp32
      - key: AUTO_REFRESH_ENABLED
        value: "true"
      - key: REFRESH_INTERVAL_HOURS
        value: "12"
      - key: REFRESH_START_DELAY_SECONDS
        value: "20"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: REFRESH_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NODE_VERSION
        value: "22.14.0"
