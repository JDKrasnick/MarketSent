name: Refresh market data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Ingest Reddit and Google News
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install sentiment runtime
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Warm sentiment model
        run: npm run warm-model

      - name: Build source snapshot
        run: python3 scripts/build_snapshot.py --model

      - name: Publish changed data
        run: |
          if git diff --quiet -- frontend/public/data/marketsent.json; then
            echo "No source changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/public/data/marketsent.json
          git commit -m "Refresh market sentiment data"
          git pull --rebase origin main
          git push origin HEAD:main
